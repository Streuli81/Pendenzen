<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projekte & Aufgaben</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>

  <body>
    <!-- ================= HEADER ================= -->
    <header class="app-header">
      <div class="app-title">
        <span class="emoji">🧩</span>
        <h1>Projekte & Aufgaben</h1>
      </div>
      <div class="header-status">
        <span id="syncStatus">–</span>
      </div>
    </header>

    <main>
      <!-- ================= NEUE AUFGABE ================= -->
      <section class="card">
        <h2>Neue Aufgabe / Projekt</h2>

        <div class="form-grid">
          <label>
            Titel
            <input id="title" type="text" placeholder="z. B. Offerte Müller vorbereiten" />
          </label>

          <label>
            Fällig am
            <input id="due" type="date" />
          </label>

          <label>
            Priorität
            <select id="prio">
              <option value="hoch">Hoch</option>
              <option value="mittel" selected>Mittel</option>
              <option value="tief">Tief</option>
            </select>
          </label>

          <label>
            Projekt
            <input id="project" type="text" placeholder="z. B. Kunde Müller" />
          </label>

          <label class="span2">
            Notizen
            <textarea id="notes" rows="2" placeholder="Kurzbeschreibung…"></textarea>
          </label>

          <label>
            Tags (Komma-getrennt)
            <input id="tags" type="text" placeholder="angebot, wichtig" />
          </label>

          <label>
            Schätzung (Std.)
            <input id="estimate" type="number" step="0.25" />
          </label>
        </div>

        <div class="form-buttons">
          <button id="add" class="primary">➕ Hinzufügen</button>
          <button id="clearForm" class="secondary">🧹 Form leeren</button>
        </div>
      </section>

      <!-- ================= FILTER ================= -->
      <section class="card">
        <h2>Filtern & Sortieren</h2>
        <div class="filter-grid">
          <input id="q" type="text" placeholder="Suche in Titel, Notizen, Tags…" />
          <select id="fProject">
            <option value="">Alle Projekte</option>
          </select>
          <select id="fStatus">
            <option value="">Alle Stati</option>
            <option value="offen">Offen</option>
            <option value="erledigt">Erledigt</option>
          </select>
          <select id="fSort">
            <option value="createdDesc">Neueste zuerst</option>
            <option value="dueAsc">Fälligkeitsdatum</option>
            <option value="prioDesc">Priorität</option>
          </select>
        </div>
      </section>

      <!-- ================= LISTE ================= -->
      <section class="card">
        <h2>Liste</h2>
        <p id="counts" class="muted">0 von 0 Einträgen angezeigt</p>
        <div id="list"></div>
      </section>
    </main>

    <footer class="footer">
      <small>
        Offline-fähig gespeichert –
        <a href="#" id="installPWA">📲 Als App installieren</a>
      </small>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
